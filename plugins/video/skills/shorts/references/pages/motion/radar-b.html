<!doctype html><html><head><meta charset="utf-8">
<style>
svg text{font-family:Title}
</style></head><body><div id="stage"></div>
<script src="vendor/gsap/gsap.min.js"></script><script src="vendor/gsap/CustomEase.min.js"></script>
<script src="kit.js"></script><script src="words.js"></script>
<script>
/* B · THE CITY. Every company is a building of an isometric city. On « hiring » the windows of three of them light up
   yellow, floor by floor; « Hiring · SDR » flags rise on them. The rest of the city sinks; the one we look at unfolds into
   its own floor: its sales team, an empty desk that calls, filled on « improvements », and its sales climbing as columns. */
gsap.registerPlugin(CustomEase);
const NS = "http://www.w3.org/2000/svg";
const A = 90, D = A * 0.5774, CX = 540, CY = 760;      // the grid: a cell's half width / half height, the back cell's centre
const cell = (i, j) => [CX + (i - j) * A, CY + (i + j) * D];
const HIRE = ["3,0", "0,3", "3,3"], HERO = "3,3";
const R = K.rand(11);
const B = [];   // the buildings
for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
  const [x, y] = cell(i, j), key = `${i},${j}`, hire = HIRE.includes(key);
  let H = 70 + Math.round(R() * 190);
  if (key === "3,0") H = 210; if (key === "0,3") H = 172; if (key === "3,3") H = 224;
  H = Math.min(H, y - 500 - (hire ? 120 : 0));
  B.push({ i, j, x, y, key, hire, H, w: A * 0.66, s: { h: 0, lit: 0, dim: 0, sink: 0 } });
}
B.sort((a, b) => (a.i + a.j) - (b.i + b.j) || (a.i - b.i));
const FLOOR = 30;
const ST = { slab: 0, slabFade: 0, plate: 0, cols: [0, 0, 0, 0, 0], push: 0 };
const ease = n => gsap.parseEase(n), seg = (t, a, b, e = x => x) => e(K.clamp((t - a) / (b - a)));
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const mk = (tag, at, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); parent && parent.appendChild(e); return e; };

// one iso box: base centre (x,y), half width w (half depth w*.577), height h → its 3 faces' points
function box(x, y, w, h) {
  const d = w * 0.5774;
  const N = [x, y - d], E = [x + w, y], S = [x, y + d], W = [x - w, y], up = p => [p[0], p[1] - h];
  return { top: [up(N), up(E), up(S), up(W)], left: [W, S, up(S), up(W)], right: [S, E, up(E), up(S)], N, E, S, W, d };
}

let svg, cam, ground, city, flags = [], plateG, plateEls, people = [], cols = [];
PAGE({ dur: 9.64,
  cues: [
    { t: 0.40, name: "m:data-whoosh", gain: -19 },
    { t: 1.25, name: "m:cinematic-data-collect", gain: -19 },
    { t: 4.10, name: "m:ui-premium-open", gain: -16 },
    { t: 4.80, name: "m:premium-pop-2", gain: -18 },
    { t: 6.00, name: "m:cinematic-medium-whoosh", gain: -19 },
    { t: 7.72, name: "m:premium-pop-1", gain: -16 },
  ],
  build(tl) {
    const st = document.getElementById("stage");
    svg = mk("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920", style: "position:absolute;left:0;top:0;overflow:visible" }, st);
    const defs = mk("defs", {}, svg);
    defs.innerHTML = `
      <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#1A1A1A" flood-opacity=".16"/></filter>
      <filter id="bshadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="tagsh" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1A1A1A" flood-opacity=".22"/></filter>
      <clipPath id="clipc"><circle cx="0" cy="0" r="50"/></clipPath>`;
    cam = mk("g", {}, svg);
    // the ground slab
    ground = mk("g", { filter: "url(#soft)" }, cam);
    const g0 = box(CX, CY + 4 * D, A * 5.25, 0);
    ground.slab = mk("polygon", { fill: "#FFFFFF" }, ground);
    ground.edgeL = mk("polygon", { fill: "#ECEAF1" }, ground);
    ground.edgeR = mk("polygon", { fill: "#DEDBE5" }, ground);
    ground.streets = mk("g", { stroke: "#EEECF2", "stroke-width": 2 }, ground);
    for (let k = 1; k < 5; k++) {
      const a = cell(k - 0.5, -0.5), b = cell(k - 0.5, 4.5), c = cell(-0.5, k - 0.5), d = cell(4.5, k - 0.5);
      mk("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, ground.streets);
      mk("line", { x1: c[0], y1: c[1], x2: d[0], y2: d[1] }, ground.streets);
    }
    city = mk("g", {}, cam);
    const shadows = mk("g", { filter: "url(#bshadow)", opacity: 0.55 }, city);
    for (const b of B) {
      b.shadow = mk("polygon", { fill: "rgba(26,26,26,.16)" }, shadows);
    }
    for (const b of B) {
      const g = b.g = mk("g", {}, city);
      b.left = mk("polygon", { fill: "#EFEDF4" }, g);
      b.right = mk("polygon", { fill: "#DCD9E3" }, g);
      b.top = mk("polygon", { fill: "#FFFFFF" }, g);
      b.win = [];
      const F = Math.floor((b.H - 16) / FLOOR);
      b.F = F;
      for (let f = 0; f < F; f++) for (const side of ["l", "r"]) for (const c of [0, 1]) {
        b.win.push({ f, side, c, el: mk("polygon", {}, g) });
      }
      b.roofLine = mk("polyline", { fill: "none", stroke: "#FFFFFF", "stroke-width": 1.5, opacity: 0.9 }, g);
    }
    // ── the city: the slab lands, the buildings rise in a diagonal wave on « a whole list of companies »
    tl.to(ST, { slab: 1, duration: 0.6, ease: "back.out(1.25)" }, 0.3);
    const rise = K.A("whole") - 0.25;
    B.forEach(b => tl.to(b.s, { h: 1, duration: 0.62, ease: "back.out(1.7)" }, rise + (b.i + b.j) * 0.15 + (b.i * 7 + b.j * 3) % 5 * 0.02));
    // « hiring »: the windows of three light up floor by floor
    const HI = K.A("hiring");
    B.filter(b => b.hire).forEach((b, k) => tl.to(b.s, { lit: 1, duration: 0.55, ease: "power1.inOut" }, HI - 0.02 + k * 0.1));
    B.filter(b => !b.hire).forEach(b => tl.to(b.s, { dim: 1, duration: 0.4, ease: "power2.out" }, HI + 0.25));
    // « an SDR »: a flag rises on each of them
    for (const b of B.filter(b => b.hire)) {
      const bx = box(b.x, b.y, b.w, b.H);
      const topY = bx.N[1] - b.H;
      const g = mk("g", { transform: `translate(${b.x},${topY})` }, cam);
      const stem = mk("line", { x1: 0, y1: 0, x2: 0, y2: -58, stroke: "#1A1A1A", "stroke-width": 4, "stroke-linecap": "round" }, g);
      const pill = mk("g", { transform: "translate(0,-58)" }, g);
      const inner = mk("g", {}, pill);
      mk("rect", { x: -100, y: -54, width: 200, height: 54, rx: 27, fill: "#1A1A1A", filter: "url(#tagsh)" }, inner);
      mk("circle", { cx: -74, cy: -27, r: 8, fill: "#FFD90D" }, inner);
      const tx = mk("text", { x: -58, y: -17, fill: "#FFFFFF", "font-size": 27, "font-weight": 700, "letter-spacing": "-0.5" }, inner);
      tx.innerHTML = `Hiring <tspan fill="#9C99A8">·</tspan> <tspan fill="#FFD90D">SDR</tspan>`;
      flags.push({ b, g, stem, inner });
    }
    const SD = K.A("sdr,") - 0.12;
    flags.forEach((f, k) => {
      tl.fromTo(f.stem, { attr: { y2: 0 } }, { attr: { y2: -58 }, duration: 0.25, ease: "power3.out", immediateRender: true }, SD + k * 0.09);
      tl.fromTo(f.inner, { scale: 0, rotation: -14, transformOrigin: "50% 100%" }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)", immediateRender: true }, SD + 0.1 + k * 0.09);
    });
    // ── « so you know »: the city sinks; the other two flags fold
    const S = K.A("so") - 0.05;
    const hero = B.find(b => b.key === HERO);
    B.filter(b => b !== hero).forEach(b => {
      const dist = Math.hypot(b.i - hero.i, b.j - hero.j);
      tl.to(b.s, { sink: 1, duration: 0.38, ease: "back.in(1.4)" }, S + (5.7 - dist) * 0.05 + (b.hire ? 0.1 : 0));
    });
    flags.filter(f => f.b !== hero).forEach((f, k) => {
      tl.to(f.inner, { scale: 0, duration: 0.25, ease: "back.in(2)" }, S + 0.12 + k * 0.05);
      tl.to(f.stem, { attr: { y2: 0 }, duration: 0.2, ease: "power2.in" }, S + 0.3 + k * 0.05);
    });
    // ── « this team »: the hero unfolds into its own floor (height collapses, footprint opens) — the slab goes
    const TEAM = K.A("team") - 0.1;
    const heroFlag = flags.find(f => f.b === hero);
    tl.to(heroFlag.inner, { scale: 0, duration: 0.22, ease: "back.in(2)" }, TEAM - 0.05);
    tl.to(heroFlag.stem, { attr: { y2: 0 }, duration: 0.18, ease: "power2.in" }, TEAM + 0.1);
    tl.to(ST, { plate: 1, duration: 0.75, ease: "expo.inOut" }, TEAM);
    tl.to(ST, { slabFade: 1, duration: 0.35, ease: "power2.inOut" }, TEAM + 0.3);

    // the plate's furniture, drawn once (plate geometry at full size)
    plateG = mk("g", { opacity: 0 }, cam);
    const PW = 400, PC = [540, 1080];
    const P = (u, v) => [PC[0] + PW * (u - v), PC[1] - PW * 0.5774 + PW * 0.5774 * (u + v)];
    // the sales columns: at the back
    const colsG = mk("g", {}, plateG);
    const pplG = mk("g", {}, plateG);
    const names = ["marcus", "julia", "kenji", "sofia"];
    const U = [0.14, 0.32, 0.5, 0.68, 0.86];
    U.forEach((u, k) => {
      const [x, y] = [540 + 472 * (k - 2) * 0.32, 695.5 + 272.5 * 1.36];
      const g = mk("g", { transform: `translate(${x},${y})` }, pplG);
      mk("ellipse", { cx: 0, cy: 0, rx: 34, ry: 17, fill: "rgba(26,26,26,.13)", filter: "url(#bshadow)" }, g);
      const body = mk("g", {}, g);
      if (k < 4) {
        mk("line", { x1: 0, y1: 0, x2: 0, y2: -46, stroke: "#1A1A1A", "stroke-width": 5, "stroke-linecap": "round" }, body);
        mk("circle", { cx: 0, cy: -100, r: 56, fill: "#FFFFFF", filter: "url(#tagsh)" }, body);
        const im = mk("image", { href: K.img(`people/${names[k]}.jpg`), x: -50, y: -150, width: 100, height: 100, "clip-path": "url(#clipP" + k + ")" }, body);
        const cp = mk("clipPath", { id: "clipP" + k }, defs); mk("circle", { cx: 0, cy: -100, r: 50 }, cp);
      } else {
        mk("line", { x1: 0, y1: 0, x2: 0, y2: -46, stroke: "#C9C6D2", "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": "2 9" }, body);
        mk("circle", { cx: 0, cy: -100, r: 52, fill: "#FFFFFF", stroke: "#C9C6D2", "stroke-width": 4, "stroke-dasharray": "9 9" }, body);
        const t = mk("text", { x: 0, y: -90, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#A3A0AE" }, body); t.textContent = "SDR";
        g.ring = mk("circle", { cx: 0, cy: -100, r: 62, fill: "none", stroke: "#FFD90D", "stroke-width": 7, opacity: 0 }, g);
        const hire = mk("g", {}, g);
        mk("line", { x1: 0, y1: 0, x2: 0, y2: -46, stroke: "#1A1A1A", "stroke-width": 5, "stroke-linecap": "round" }, hire);
        mk("circle", { cx: 0, cy: -100, r: 57, fill: "#FFD90D", filter: "url(#tagsh)" }, hire);
        const cp = mk("clipPath", { id: "clipH" }, defs); mk("circle", { cx: 0, cy: -100, r: 49 }, cp);
        mk("image", { href: K.img("people/nina.jpg"), x: -49, y: -149, width: 98, height: 98, "clip-path": "url(#clipH)" }, hire);
        const tag = mk("g", { transform: "translate(40,-46)" }, hire);
        mk("rect", { x: 0, y: -22, width: 82, height: 44, rx: 22, fill: "#1A1A1A" }, tag);
        const tt = mk("text", { x: 41, y: 10, "text-anchor": "middle", "font-size": 26, "font-weight": 700, fill: "#FFD90D" }, tag); tt.textContent = "SDR";
        g.hire = hire; g.tag = tag; g.empty = body;
      }
      people.push({ g, body });
    });
    // columns (sales), at the back row
    U.forEach((u, k) => {
      const [x, y] = [540 + 472 * (k - 2) * 0.27, 695.5 + 272.5 * 0.62];
      const c = { x, y, H: [64, 84, 108, 136, 220][k], s: { h: 0 }, yellow: k === 4 };
      c.l = mk("polygon", { fill: c.yellow ? "#F5CC00" : "#2B2B2B" }, colsG);
      c.r = mk("polygon", { fill: c.yellow ? "#E2BB00" : "#1A1A1A" }, colsG);
      c.t = mk("polygon", { fill: c.yellow ? "#FFE24D" : "#4A4950" }, colsG);
      cols.push(c);
    });
    const salesTag = mk("g", {}, plateG);
    const c4 = cols[4], tb = box(c4.x, c4.y, 30, c4.H);
    const tagG = mk("g", { transform: `translate(${c4.x - 76},${tb.N[1] - c4.H - 52})` }, salesTag);
    mk("rect", { x: 0, y: -28, width: 152, height: 56, rx: 28, fill: "#1A1A1A", filter: "url(#tagsh)" }, tagG);
    const stx = mk("text", { x: 24, y: 10, "font-size": 30, "font-weight": 700, fill: "#FFFFFF", "letter-spacing": "-0.5" }, tagG);
    stx.innerHTML = `Sales <tspan fill="#FFD90D">↗</tspan>`;

    tl.to(plateG, { opacity: 1, duration: 0.01 }, TEAM + 0.62);
    people.forEach((p, k) => tl.from(p.body, { scale: 0, transformOrigin: "50% 100%", duration: 0.45, ease: "back.out(2.2)" }, TEAM + 0.62 + k * 0.08));
    const seat = people[4].g;
    gsap.set(seat.hire, { opacity: 0 });
    const L = K.A("looking");
    [0, 0.5].forEach(d => tl.fromTo(seat.ring, { attr: { r: 56 }, opacity: 0.95 }, { attr: { r: 84 }, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, L + d));
    const I = K.A("improvements");
    tl.to(seat.empty, { scale: 0.5, opacity: 0, transformOrigin: "50% 50%", duration: 0.16, ease: "power2.in" }, I - 0.08);
    tl.fromTo(seat.hire, { y: -160, scale: 1, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out", immediateRender: false }, I);
    tl.from(seat.tag, { scale: 0, transformOrigin: "0% 50%", duration: 0.35, ease: "back.out(3)" }, I + 0.42);
    // « sales field »: the columns rise, the last one yellow
    const SA = K.A("sales") - 0.35;
    cols.forEach((c, k) => tl.to(c.s, { h: 1, duration: 0.55, ease: "back.out(1.6)" }, SA + k * 0.09));
    tl.from(tagG, { scale: 0, transformOrigin: "50% 100%", duration: 0.4, ease: "back.out(2.6)" }, SA + 0.7);
    // a slow push-in for life
    tl.to(ST, { push: 1, duration: 9.3, ease: "none" }, 0.3);
  },
  draw(t) {
    // camera: a slow push
    const z = 1 + 0.035 * ST.push;
    cam.setAttribute("transform", `translate(540 1000) scale(${z}) translate(-540 -1000)`);
    // ground slab: lands from scale 0 (flat diamond grows), fades as the plate opens
    const g0 = box(CX, CY + 4 * D, A * 5.25 * Math.max(0.001, ST.slab), 0);
    const th = 26 * ST.slab;
    ground.slab.setAttribute("points", pts(g0.top));
    ground.edgeL.setAttribute("points", pts([g0.W, g0.S, [g0.S[0], g0.S[1] + th], [g0.W[0], g0.W[1] + th]]));
    ground.edgeR.setAttribute("points", pts([g0.S, g0.E, [g0.E[0], g0.E[1] + th], [g0.S[0], g0.S[1] + th]]));
    ground.setAttribute("opacity", (1 - ST.slabFade).toFixed(3));
    ground.streets.setAttribute("opacity", K.clamp(ST.slab * 3 - 2).toFixed(3));
    // the buildings
    for (const b of B) {
      const hero = b.key === HERO;
      let h = b.H * b.s.h * (1 - b.s.sink);
      let w = b.w;
      if (hero) {
        const p = ST.plate;
        h = K.lerp(h, 26, gsap.parseEase("power2.inOut")(K.clamp(p * 1.6)));
        w = K.lerp(b.w, A * 5.25, gsap.parseEase("expo.inOut")(K.clamp((p - 0.2) / 0.8)));
      }
      const show = h > 0.5;
      b.g.style.display = show ? "" : "none";
      b.shadow.style.display = show ? "" : "none";
      if (!show) continue;
      const bx = box(hero ? K.lerp(b.x, 540, ST.plate) : b.x, hero ? K.lerp(b.y, CY + 4 * D + 26, ST.plate) : b.y, w, h);
      b.top.setAttribute("points", pts(bx.top));
      b.left.setAttribute("points", pts(bx.left));
      b.right.setAttribute("points", pts(bx.right));
      b.roofLine.setAttribute("points", pts([bx.top[3], bx.top[2], bx.top[1]]));
      // a soft cast shadow to the right on the ground
      const sh = Math.min(h, 160) * 0.55;
      b.shadow.setAttribute("points", pts([bx.S, bx.E, [bx.E[0] + sh, bx.E[1] - sh * 0.15], [bx.S[0] + sh, bx.S[1] - sh * 0.15]]));
      b.shadow.style.opacity = hero ? (1 - ST.plate).toFixed(3) : "1";
      const dim = b.s.dim;
      b.g.setAttribute("opacity", (1 - 0.42 * dim).toFixed(3));
      const winVis = hero ? 1 - K.clamp(ST.plate * 3) : 1;
      for (const wi of b.win) {
        const z0 = 14 + wi.f * FLOOR, z1 = z0 + 15;
        if (z1 > h - 8 || winVis <= 0) { wi.el.style.display = "none"; continue; }
        wi.el.style.display = "";
        const a = wi.side === "l" ? bx.W : bx.S, c = wi.side === "l" ? bx.S : bx.E;
        const s0 = wi.c ? 0.56 : 0.16, s1 = s0 + 0.28;
        const P = (s, zz) => [a[0] + (c[0] - a[0]) * s, a[1] + (c[1] - a[1]) * s - zz];
        wi.el.setAttribute("points", pts([P(s0, z0), P(s1, z0), P(s1, z1), P(s0, z1)]));
        const lit = b.s.lit * (b.F + 1) - wi.f > 0.5;
        wi.el.setAttribute("fill", lit ? (wi.side === "l" ? "#FFD90D" : "#F2C400") : (wi.side === "l" ? "#D6D2DE" : "#C6C2D0"));
        wi.el.style.opacity = winVis;
      }
    }
    // the plate's columns
    for (const c of cols) {
      const h = c.H * c.s.h;
      const show = h > 0.5;
      [c.l, c.r, c.t].forEach(e => e.style.display = show ? "" : "none");
      if (!show) continue;
      const bx = box(c.x, c.y, 30, h);
      c.l.setAttribute("points", pts(bx.left)); c.r.setAttribute("points", pts(bx.right)); c.t.setAttribute("points", pts(bx.top));
    }
  }
});
</script></body></html>
