<!doctype html><html><head><meta charset="utf-8">
<style>
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
.num{position:absolute;left:0;top:0;font:800 600px/1 Title;letter-spacing:-.07em;color:#EDEBF1;white-space:nowrap;transform-origin:50% 50%}
.fl{position:absolute;left:0;top:0;font:500 26px/1 Mono;letter-spacing:.08em;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:14px}
.fl b{display:block;width:44px;height:3px;background:var(--ink);border-radius:2px}
.card{position:absolute;left:0;top:0;background:#fff;border-radius:46px;overflow:hidden;transform-origin:50% 50%;
  box-shadow:0 0 0 1.5px rgba(26,26,26,.06),0 3px 5px rgba(26,26,26,.06),0 40px 70px -28px rgba(26,26,26,.38)}
.card .ph{position:absolute;left:16px;top:16px;right:16px;border-radius:32px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .rl{position:absolute;left:0;right:0;text-align:center;font:640 38px/1 Title;letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.card .band{position:absolute;left:0;right:0;bottom:0;height:104px;background:var(--y);display:flex;align-items:center;justify-content:center;gap:12px;
  font:780 48px/1 Title;letter-spacing:-.04em;color:var(--ink)}
.edge{position:absolute;left:0;top:0;border-radius:54px;border:9px solid var(--ink);transform-origin:50% 50%}
.tag{position:absolute;left:0;top:0;white-space:nowrap;background:var(--ink);color:#fff;font:720 44px/1 Title;letter-spacing:-.035em;
  padding:15px 26px 18px 20px;border-radius:999px;display:flex;align-items:center;gap:12px;transform-origin:0 50%;
  box-shadow:0 3px 4px rgba(26,26,26,.1),0 22px 40px -16px rgba(26,26,26,.45)}
.ind{position:absolute;right:103px;top:478px;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:999px;
  padding:0 30px 0 22px;height:84px;font:760 50px/1 Title;letter-spacing:-.03em;transform-origin:100% 50%;z-index:40;
  box-shadow:0 3px 4px rgba(26,26,26,.12),0 22px 40px -16px rgba(26,26,26,.45)}
.ind .win{height:56px;overflow:hidden}.ind .col{display:flex;flex-direction:column}.ind .col span{height:56px;line-height:56px;display:block}
</style></head><body><div id="stage"></div>
<script src="vendor/gsap/gsap.min.js"></script><script src="vendor/gsap/CustomEase.min.js"></script><script src="vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="kit.js"></script><script src="words.js"></script>
<script>
/* C · "The elevator": the company is a tower of floors, the frame is the elevator shaft. We start on the top floor
   (the buyer), drop two floors to the team, then a yellow cable shoots up from the Senior SDR, through the Head of Sales'
   floor, to the buyer; the camera rides it. At the end the tower folds down into one frame: the whole path at once. */
gsap.registerPlugin(CustomEase, ScrambleTextPlugin);
const A = K.A;
K.el("svg", { width: 0, height: 0, style: { position: "absolute" }, html: `<filter id="mb" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur id="mbs" stdDeviation="0 0"/></filter>` });
const world = K.el("div", { id: "world" });
const cam = { fx: 540, fy: 40, s: 1.06, sy: 960, mb: 0, follow: 0 };
const T = { G: 1350 };   // the height of a floor (the tower folds at the end)
// floors: numerals, labels
const FLO = [
  { n: "03", lab: "C-LEVEL", f: 0 }, { n: "02", lab: "MANAGERS", f: 1 }, { n: "01", lab: "TEAM", f: 2 },
].map(o => { o.num = K.el("div", { class: "num", text: o.n }, world); o.fl = K.el("div", { class: "fl", html: `<b></b><span>${o.n} · ${o.lab}</span>` }, world); o.st = { in: 0, lab: 0 }; return o; });
// the cable (under the cards)
const svg = K.el("svg", { width: 1080, height: 1920, style: { position: "absolute", left: 0, top: 0, overflow: "visible" } }, world);
K.el("defs", { html: `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>` }, svg);
const cabG = K.el("path", { fill: "none", stroke: "#FFD90D", "stroke-width": 60, "stroke-linecap": "round", "stroke-linejoin": "round", filter: "url(#glow)", opacity: .6 }, svg);
const cab = K.el("path", { fill: "none", stroke: "#FFD90D", "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
const headC = K.el("circle", { r: 22, fill: "#fff", stroke: "#FFD90D", "stroke-width": 10 }, svg);
const trail = { p: 0, glow: 0 };
// cards
const CARDS = [
  { id: "cmo", who: "tom", role: "CMO", x: 540, f: 0, w: 440, h: 540, big: 1 },
  { id: "sales", who: "david", role: "Head of Sales", x: 350, f: 1, w: 320, h: 400 },
  { id: "mkt", who: "emma", role: "Marketing Lead", x: 730, f: 1, w: 320, h: 400 },
  { id: "sdr", who: "kenji", role: "SDR", x: 245, f: 2, w: 270, h: 345 },
  { id: "senior", who: "nina", role: "Senior SDR", x: 540, f: 2, w: 270, h: 345 },
  { id: "growth", who: "lucas", role: "Growth", x: 835, f: 2, w: 270, h: 345 },
];
const by = {};
CARDS.forEach(c => {
  by[c.id] = c;
  c.st = { in: 0, pun: 1, dim: 0, band: 0, edge: 0, flash: 0, fs: 1, dx: 0 };
  if (c.id === "senior") { c.edgeEl = K.el("div", { class: "edge", style: { width: c.w + 36 + "px", height: c.h + 36 + "px" } }, world); }
  c.el = K.el("div", { class: "card", style: { width: c.w + "px", height: c.h + "px" } }, world);
  const ph = c.w - 32;
  K.el("div", { class: "ph", style: { height: ph + "px" }, html: `<img src="${K.img("people/" + c.who + ".jpg")}">` }, c.el);
  K.el("div", { class: "rl", text: c.role, style: { top: (ph + 16 + (c.h - ph - 16) / 2 - 19) + "px", fontSize: c.big ? "58px" : (c.w < 300 ? "36px" : "40px"), fontWeight: c.big ? 780 : 640 } }, c.el);
  if (c.big) c.bandEl = K.el("div", { class: "band", html: `<svg width="38" height="38" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1A1A1A"/><path d="M7 12.3l3.2 3.2L17 8.7" fill="none" stroke="#FFD90D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Can buy` }, c.el);
  c.fl = K.el("div", { class: "edge", style: { width: c.w + 30 + "px", height: c.h + 30 + "px", borderColor: "#FFD90D", borderWidth: "12px", opacity: 0 } }, world);
  world.insertBefore(c.fl, c.el);
});
const tag = K.el("div", { class: "tag", html: `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 20V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="#FFD90D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Influence` }, world);
const tg = { in: 0 };
const rider = K.el("div", { class: "tag", style: { zIndex: 41, transformOrigin: "50% 50%" }, html: `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 20V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="#FFD90D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Influence` });
const rd = { in: 0, out: 0 };
const ind = K.el("div", { class: "ind", html: `<svg width="34" height="40" viewBox="0 0 24 28"><path d="M12 3l7 8H5z" fill="#FFD90D"/><path d="M12 25l7-8H5z" fill="#FFFFFF" opacity=".35"/></svg><div class="win"><div class="col"><span>03</span><span>02</span><span>01</span></div></div>` });
const indCol = ind.querySelector(".col"), indArr = ind.querySelectorAll("path"), ix = { in: 0, lock: 0 };
const FY = f => f * T.G;
const rp = (pts, r = 44) => {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i - 1], [bx, by2] = pts[i], [cx, cy] = pts[i + 1];
    const l1 = Math.hypot(bx - ax, by2 - ay), l2 = Math.hypot(cx - bx, cy - by2), rr = Math.min(r, l1 / 2, l2 / 2);
    d += `L${bx + (ax - bx) * rr / l1} ${by2 + (ay - by2) * rr / l1}Q${bx} ${by2} ${bx + (cx - bx) * rr / l2} ${by2 + (cy - by2) * rr / l2}`;
  }
  return d + `L${pts[pts.length - 1][0]} ${pts[pts.length - 1][1]}`;
};
const cablePts = () => {
  const s = by.senior, h = by.sales, c = by.cmo, G = T.G;
  const bot = k => FY(k.f) - k.h / 2 + (k.h + (k.big ? 104 * k.st.band : 0)) * k.st.fs;
  const cb = bot(c), y1 = (cb + G - h.h / 2) / 2, y2 = (bot(h) + 2 * G - s.h / 2) / 2;
  return [[s.x, 2 * G - s.h / 2], [s.x, y2], [h.x, y2], [h.x, y1], [c.x, y1], [c.x, cb]];
};

PAGE({
  dur: 7.76,
  cues: [
    { t: 0.34, name: "m:ui-premium-open", gain: -17 },
    { t: 2.98, name: "m:premium-pop-1", gain: -16 },
    { t: 4.68, name: "m:cinematic-fast-whoosh", gain: -18 },
    { t: 5.46, name: "m:cinematic-click", gain: -17 },
    { t: 6.0, name: "m:cinematic-medium-whoosh", gain: -18 },
    { t: 6.95, name: "m:premium-pop-3", gain: -16 },
  ],
  build(tl) {
    const C = by.cmo.st, F0 = FLO[0].st;
    const FT = (o, a, b, pos) => tl.fromTo(o, a, Object.assign({ immediateRender: false }, b), pos);
    // 1 · top floor: the buyer's card flips up into place; the floor's numeral slides in behind
    FT(C, { in: 0 }, { in: 1, duration: .7, ease: "expo.out" }, .3);
    FT(F0, { in: 0 }, { in: 1, duration: .9, ease: "expo.out" }, .36);
    FT(F0, { lab: 0 }, { lab: 1, duration: .5, ease: "power2.out" }, .7);
    FT(ix, { in: 0 }, { in: 1, duration: .5, ease: "back.out(2.2)" }, .62);
    tl.to(cam, { fx: 520, s: 1.08, duration: 1.0, ease: "sine.inOut" }, 2.0);
    tl.to(cam, { s: 1.04, duration: 1.6, ease: "none" }, .4);
    FT(C, { pun: 1.08 }, { pun: 1, duration: .6, ease: "elastic.out(1,.45)" }, A("charge,") - .1);
    tl.to(cam, { s: 1.14, duration: .35, ease: "expo.out" }, A("charge,") - .12).to(cam, { s: 1.0, duration: .9, ease: "power2.inOut" }, A("charge,") + .3);

    // 2 · « buy » : the card's yellow band slides up
    tl.to(C, { band: 1, duration: .45, ease: "expo.out" }, A("buy"));
    FT(C, { pun: 1.1 }, { pun: 1, duration: .6, ease: "elastic.out(1,.42)" }, A("buy") + .05);
    tl.to(cam, { s: 1.06, fx: 540, duration: 1.2, ease: "sine.inOut" }, 3.3);
    FT(C, { pun: 1.08 }, { pun: 1, duration: .55, ease: "elastic.out(1,.45)" }, A("buy", 2));
    // 3 · « and then there is people » : the elevator drops two floors to the team
    tl.to(cam, { fy: 2 * 1350 - 20, s: 1.16, duration: .85, ease: CustomEase.create("drop", "M0,0 C0.5,0 0.6,0.15 0.7,0.5 0.78,0.85 0.86,1 1,1") }, 4.62);
    tl.to(cam, { mb: 1, duration: .35, ease: "power2.in" }, 4.8).to(cam, { mb: 0, duration: .32, ease: "power2.out" }, 5.15);
    [1, 2].forEach(f => FT(FLO[f].st, { in: 0, lab: 0 }, { in: 1, lab: 1, duration: .6, ease: "expo.out" }, f === 1 ? 4.8 : 5.05));
    ["sales", "mkt"].forEach((id, i) => FT(by[id].st, { in: 0 }, { in: 1, duration: .5, ease: "expo.out" }, 4.8 + i * .04));
    ["sdr", "senior", "growth"].forEach((id, i) => FT(by[id].st, { in: 0 }, { in: 1, duration: .6, ease: "back.out(1.5)" }, 5.1 + i * .06));
    tl.to([by.sdr.st, by.growth.st], { dim: 1, duration: .4, ease: "power2.out" }, 5.48);
    FT(by.senior.st, { edge: 0 }, { edge: 1, duration: .45, ease: "back.out(2)" }, 5.46);
    FT(by.senior.st, { pun: 1.1 }, { pun: 1.04, duration: .5, ease: "back.out(2)" }, 5.46);
    tl.to(cam, { fy: 2 * 1350 - 60, duration: .5, ease: "sine.inOut" }, 5.5);
    // 4 · « influence the decision » : the yellow cable shoots up, the camera rides it to the top floor
    FT(trail, { p: 0 }, { p: 1, duration: 1.0, ease: CustomEase.create("cab", "M0,0 C0.3,0 0.4,0.3 0.5,0.5 0.6,0.7 0.68,1 1,1") }, 5.98);
    FT(cam, { follow: 0 }, { follow: 1, duration: .25, ease: "power2.in" }, 6.02);
    tl.to(cam, { mb: .55, duration: .2, ease: "power2.in" }, 6.08).to(cam, { mb: .55, duration: .4 }, 6.28).to(cam, { mb: 0, duration: .25, ease: "power2.out" }, 6.7);
    FT(rd, { in: 0 }, { in: 1, duration: .35, ease: "back.out(2.2)" }, 6.12);
    FT(rd, { out: 0 }, { out: 1, duration: .22, ease: "power2.in" }, 6.86);
    FT(tg, { in: 0 }, { in: 1, duration: .4, ease: "back.out(2.4)" }, 7.12);
    FT(by.sales.st, { flash: 1 }, { flash: 0, duration: .7, ease: "power2.out" }, 6.42);
    FT(by.sales.st, { pun: 1.1 }, { pun: 1, duration: .55, ease: "elastic.out(1,.4)" }, 6.42);
    FT(C, { pun: 1.14 }, { pun: 1, duration: .7, ease: "elastic.out(1,.38)" }, 6.95);
    FT(C, { flash: 1 }, { flash: 0, duration: .8, ease: "power2.out" }, 6.95);
    FT(trail, { glow: 1 }, { glow: 0, duration: .8, ease: "power2.out" }, 6.95);
    // 5 · the tower folds into one frame: the whole path
    tl.to(cam, { follow: 0, duration: .01 }, 7.0);
    // 5 · the tower folds: the people out of the story leave, the three on the path stack into one column
    const fe = { duration: .72, ease: "expo.inOut" };
    FT(cam, { fy: 150 }, Object.assign({ fy: 390, s: .77 }, fe), 7.0);
    tl.to(T, Object.assign({ G: 460 }, fe), 7.0);
    tl.to(by.sales, Object.assign({ x: 540 }, fe), 7.0);
    tl.to(C, Object.assign({ fs: .7 }, fe), 7.0);
    tl.to(by.sales.st, Object.assign({ fs: .8 }, fe), 7.0);
    tl.to(by.senior.st, Object.assign({ fs: .85 }, fe), 7.0);
    tl.to(by.sdr.st, { dx: -760, duration: .5, ease: "expo.in" }, 6.98);
    tl.to(by.growth.st, { dx: 760, duration: .5, ease: "expo.in" }, 6.98);
    tl.to(by.mkt.st, { dx: 820, duration: .5, ease: "expo.in" }, 6.98);
    tl.to(ix, { lock: 1, duration: .3, ease: "power2.out" }, 7.0);
    tl.to(FLO.map(o => o.st), { lab: 0, duration: .3, ease: "power2.in" }, 6.98);
    tl.set({}, {}, 7.76);
  },
  draw(t) {
    // the cable first (the camera may follow its head)
    const pts = cablePts();
    const d = rp(pts);
    cab.setAttribute("d", d); cabG.setAttribute("d", d);
    const L = cab.getTotalLength(), l = L * trail.p;
    [cab, cabG].forEach(e => e.setAttribute("stroke-dasharray", `${l.toFixed(1)} ${L + 100}`));
    cab.style.opacity = cabG.style.opacity = trail.p > 0 ? 1 : 0;
    cabG.setAttribute("stroke-width", (60 + 60 * trail.glow).toFixed(1)); cabG.setAttribute("opacity", (.5 + .4 * trail.glow).toFixed(2));
    const h = cab.getPointAtLength(l);
    headC.setAttribute("cx", h.x.toFixed(1)); headC.setAttribute("cy", h.y.toFixed(1));
    headC.setAttribute("opacity", trail.p > 0 && trail.p < .995 ? 1 : 0);
    const fy = cam.follow > 0 ? K.lerp(cam.fy, Math.max(h.y - 250, 150), cam.follow) : cam.fy;
    world.style.transform = `translate(${(540 - cam.fx * cam.s).toFixed(2)}px,${(cam.sy - fy * cam.s).toFixed(2)}px) scale(${cam.s.toFixed(4)})`;
    document.getElementById("mbs").setAttribute("stdDeviation", `0 ${(cam.mb * 26).toFixed(2)}`);
    world.style.filter = cam.mb > .02 ? "url(#mb)" : "none";
    // the « Influence » pill rides the cable's head (on top of everything, sharp)
    const hx = 540 + (h.x - cam.fx) * cam.s, hy = cam.sy + (h.y - fy) * cam.s;
    rider.style.transform = `translate(${hx.toFixed(1)}px,${hy.toFixed(1)}px) translate(-50%,-50%) scale(${(rd.in * (1 - .8 * rd.out)).toFixed(3)})`;
    rider.style.opacity = (K.clamp(rd.in * 3) * (1 - rd.out)).toFixed(3);
    headC.setAttribute("r", (22 * (1 - rd.in) + 0).toFixed(1));
    // the elevator's floor indicator: rolls with the camera
    const v = K.clamp(fy / T.G, 0, 2) * (1 - ix.lock);
    indCol.style.transform = `translateY(${(-v * 56).toFixed(2)}px)`;
    ind.style.transform = `scale(${ix.in.toFixed(3)})`; ind.style.opacity = K.clamp(ix.in * 3).toFixed(3);
    ind.style.filter = cam.mb > .05 ? `blur(${(cam.mb * 2).toFixed(2)}px)` : "none";
    // floors
    FLO.forEach(o => {
      const y = FY(o.f), s = o.st;
      o.num.style.transform = `translate(${(600 + 240 * (1 - s.in)).toFixed(1)}px,${(y - 360).toFixed(1)}px)`;
      o.num.style.opacity = s.in.toFixed(3);
      o.fl.style.transform = `translate(110px,${(y - (o.f === 0 ? 340 : 270)).toFixed(1)}px)`;
      o.fl.style.opacity = s.lab.toFixed(3);
      o.fl.style.clipPath = `inset(0 ${((1 - s.lab) * 100).toFixed(1)}% 0 0)`;
    });
    // cards
    CARDS.forEach(c => {
      const s = c.st, y = FY(c.f);
      const sc = s.pun * (1 - .1 * s.dim) * s.fs, He = c.h + (c.bandEl ? 104 * s.band : 0), fty = -(1 - s.fs) * He / 2, X = c.x + s.dx;
      c.el.style.transform = `translate(${(X - c.w / 2).toFixed(1)}px,${(y - c.h / 2 + 140 * (1 - s.in) + fty).toFixed(1)}px) perspective(1400px) rotateX(${(-75 * (1 - s.in)).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
      c.el.style.opacity = (K.clamp(s.in * 2.5) * (1 - .55 * s.dim)).toFixed(3);
      c.el.style.filter = s.in < .98 ? `blur(${(12 * (1 - s.in)).toFixed(2)}px)` : "none";
      if (c.bandEl) { c.el.style.height = (c.h + 104 * s.band).toFixed(1) + "px"; c.bandEl.style.transform = `translateY(${(100 * (1 - Math.min(1, s.band))).toFixed(2)}%)`; }
      if (c.edgeEl) {
        c.edgeEl.style.transform = `translate(${(X - c.w / 2 - 18).toFixed(1)}px,${(y - c.h / 2 - 18 + fty).toFixed(1)}px) scale(${((1.25 - .25 * s.edge) * sc).toFixed(4)})`;
        c.edgeEl.style.opacity = K.clamp(s.edge * 2).toFixed(3);
      }
      c.fl.style.height = (He + 30).toFixed(1) + "px";
      c.fl.style.transform = `translate(${(X - c.w / 2 - 15).toFixed(1)}px,${(y - c.h / 2 - 15 + fty).toFixed(1)}px) scale(${(sc * (1 + .08 * s.flash)).toFixed(4)})`;
      c.fl.style.opacity = s.flash.toFixed(3);
    });
    // the « Influence » tag: on the cable between the team and the managers
    const sb = FY(1) - by.sales.h / 2 + by.sales.h * by.sales.st.fs;
    const ty = (sb + 2 * T.G - by.senior.h / 2) / 2 + 52, tx = by.senior.x + 34;
    tag.style.transform = `translate(${tx}px,${(ty - 120).toFixed(1)}px) scale(${tg.in.toFixed(3)})`;
    tag.style.opacity = K.clamp(tg.in * 3).toFixed(3);
  },
});
</script></body></html>
